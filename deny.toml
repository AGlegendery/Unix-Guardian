# cargo-deny: run in CI. Every dependency must be under a licence compatible
# with distributing Unix Guardian as GPL-3.0-or-later.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are not published; their licence is the workspace's.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own crates point at each other by path; none is published.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
ignore = [
    # zvariant, zbus_names and zvariant_derive: unmaintained notice only:
    # merged into zbus 6; revisit when migrating to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained notice only: merged into zbus 6; revisit when migrating to zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained notice only: merged into zbus 6; revisit when migrating to zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained notice only: merged into zbus 6; revisit when migrating to zbus 6" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
