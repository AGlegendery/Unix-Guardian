[package]
name = "ug-app"
description = "Unix Guardian desktop window (optional; closes completely)"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/AGlegendery/Unix-Guardian"

# Its own workspace, deliberately: the window needs WebKitGTK to build, and the
# daemon, agent and CLI must keep building and testing without it (CI, servers,
# distributions that package the core alone).
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ug-core = { path = "../../crates/ug-core" }
ug-proto = { path = "../../crates/ug-proto" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["sync", "time"] }
futures-lite = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
