<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Installed to /usr/share/dbus-1/system.d/.
  Only root may own the name. Anyone may call it: authorisation happens per
  method through polkit, so the bus policy stays simple and the real decision
  lives in one place.
-->
<busconfig>
  <policy user="root">
    <allow own="org.unixguardian.Daemon1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.unixguardian.Daemon1"/>
  </policy>
</busconfig>
