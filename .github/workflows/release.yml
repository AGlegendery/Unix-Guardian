name: release

# A pushed tag vX.Y.Z[-pre] (scripts/release.sh makes it) builds the
# packages, signs them and makes a DRAFT release. Nothing is public, and no
# Unix Guardian offers it, until someone presses Publish on GitHub.
#
# Signing needs two repository secrets (Settings → Secrets and variables →
# Actions), set by the project's owner and never committed:
#   MINISIGN_KEY       the whole content of unix-guardian.key
#   MINISIGN_PASSWORD  its password
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in the code
        run: |
          v=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $v; use scripts/release.sh"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            fakeroot dpkg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Window dependencies
        run: cd app && npm ci
      - run: cargo test --workspace
      - name: Packages
        run: ./scripts/build-packages.sh
      - name: The tarball installs, takes over a source install and uninstalls
        run: ./scripts/tarball-install-test.sh dist/*.tar.gz
      - name: Sign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          UG_SIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          [ -n "$MINISIGN_KEY" ] || { echo "the MINISIGN_KEY secret is not set; see the top of this file"; exit 1; }
          key="$RUNNER_TEMP/unix-guardian.key"
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          cd dist
          sha256sum *.deb *.tar.gz > SHA256SUMS
          cargo run --quiet --release -p ug-core --example sign -- "$key" *.deb *.tar.gz SHA256SUMS
          rm -f "$key"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --draft $pre --title "Unix Guardian $VERSION" --generate-notes \
            dist/*.deb dist/*.deb.minisig dist/*.tar.gz dist/*.tar.gz.minisig dist/SHA256SUMS dist/SHA256SUMS.minisig
